<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Benchmark baz — E-commerce ZTB</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --accent-dim: #2a5fad;
      --ok: #3ecf8e;
      --err: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 800px at 10% -10%, #1a2744 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.75rem; }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.25rem;
      overflow-x: auto;
    }
    section h2 {
      margin: 0 0 1rem;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    label { display: block; font-size: 0.88rem; color: var(--muted); margin-bottom: 0.35rem; }
    select.seed-size-select {
      width: 100%;
      max-width: 420px;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #131b27;
      color: var(--text);
      font-size: 0.95rem;
    }
    .row-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; margin-top: 0.85rem; }
    button.primary, button.secondary {
      padding: 0.55rem 1.15rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.primary {
      border: none;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: #fff;
    }
    button.secondary {
      border: 1px solid var(--border);
      background: #131b27;
      color: var(--text);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary:not(:disabled):hover { filter: brightness(1.08); }
    button.secondary:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
    .hint { margin-top: 0.85rem; font-size: 0.82rem; color: var(--muted); border-left: 3px solid var(--border); padding-left: 0.75rem; }
    
    table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: 0.88rem; }
    th, td { border: 1px solid var(--border); padding: 0.75rem; text-align: left; vertical-align: top; }
    th { background: #131b27; font-weight: 600; color: var(--muted); }
    .th-actions { margin-top: 0.5rem; }
    .th-actions button { font-size: 0.75rem; padding: 0.3rem 0.6rem; }
    
    .timer { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .timer.loading { color: var(--accent); }
    .timer.ok { color: var(--ok); }
    .timer.err { color: var(--err); }
    .details { font-size: 0.75rem; color: var(--muted); display: block; margin-top: 0.2rem; }
    
    #seed-status { margin-top: 0.75rem; font-size: 0.88rem; }
    #seed-status.ok { color: var(--ok); }
    #seed-status.err { color: var(--err); }
    #seed-status.work { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Benchmark CRUD — 4 bazy</h1>
    <p class="subtitle">Odczyty (R) uśredniane statystycznie z rozgrzewką. Zapisy (C/U/D) wykonywane pojedynczo (stanowe).</p>

    <section>
      <h2>Generowanie danych i Indeksy</h2>
      <label for="seed-size">Profil wielkości (size)</label>
      <select id="seed-size" class="seed-size-select"></select>
      <div class="row-actions">
        <button type="button" class="primary" id="btn-seed">Zasiej dane (Seed)</button>
        <button type="button" class="secondary" id="btn-indexes">Załóż indexy</button>
      </div>
      <div id="seed-status"></div>
    </section>

    <section>
      <h2>Macierz wyników</h2>
      <table id="results-table">
        <thead>
          <tr id="table-head">
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
      </table>
    </section>
  </div>

  <script>
    const API = "";
    let metaData = null;

    async function fetchMeta() {
      const res = await fetch(API + "/api/meta");
      if (!res.ok) throw new Error("/meta: " + res.status);
      return res.json();
    }

    function setSeedStatus(kind, msg) {
      const el = document.getElementById("seed-status");
      el.className = kind;
      el.textContent = msg || "";
    }

    async function runEngineQuery(engineId, queryId) {
      const cellId = `cell-${engineId}-${queryId}`;
      const cell = document.getElementById(cellId);
      cell.className = "timer loading";
      cell.innerHTML = "Wykonywanie...";
      
      try {
        const res = await fetch(API + "/api/run/" + encodeURIComponent(engineId), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query_id: queryId }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || res.statusText);
        
        cell.className = "timer ok";
        cell.innerHTML = `<strong>${data.median_ms} ms</strong> (P95: ${data.p95_ms} ms)<br>` +
                         `<span class="details">Iter: ${data.iterations} | Wierszy: ${data.row_count}</span>`;
      } catch (e) {
        cell.className = "timer err";
        cell.innerHTML = `<strong>Błąd</strong><br><span class="details">${e.message || e}</span>`;
      }
    }

    async function runFullEngine(engineId, buttonEl) {
      buttonEl.disabled = true;
      const originalText = buttonEl.textContent;
      buttonEl.textContent = "Przetwarzanie...";
      
      for (const scenario of metaData.scenarios) {
        await runEngineQuery(engineId, scenario.id);
      }
      
      buttonEl.disabled = false;
      buttonEl.textContent = originalText;
    }

    function buildTable(meta) {
      metaData = meta;
      
      // Budowanie nagłówka
      const thead = document.getElementById("table-head");
      let headHtml = `<th>Scenariusz</th>`;
      meta.engines.forEach(eng => {
        headHtml += `
          <th>
            ${eng.label}
            <div class="th-actions">
              <button class="primary" onclick="runFullEngine('${eng.id}', this)">Uruchom wszystko</button>
            </div>
          </th>`;
      });
      thead.innerHTML = headHtml;

      // Budowanie ciała tabeli
      const tbody = document.getElementById("table-body");
      let bodyHtml = "";
      meta.scenarios.forEach(scen => {
        bodyHtml += `<tr><td><strong>[${scen.id}]</strong> ${scen.label}</td>`;
        meta.engines.forEach(eng => {
           bodyHtml += `<td id="cell-${eng.id}-${scen.id}" class="timer">—</td>`;
        });
        bodyHtml += `</tr>`;
      });
      tbody.innerHTML = bodyHtml;
      
      // Select
      const sel = document.getElementById("seed-size");
      sel.innerHTML = "";
      meta.sizes.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.label;
        sel.appendChild(opt);
      });
    }

    (async () => {
      try {
        const meta = await fetchMeta();
        buildTable(meta);

        document.getElementById("btn-seed").addEventListener("click", async () => {
          const size = document.getElementById("seed-size").value;
          const btn = document.getElementById("btn-seed");
          btn.disabled = true;
          setSeedStatus("work", "Generowanie danych — proszę czekać…");
          try {
            const res = await fetch(API + "/api/seed", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ size }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.detail || res.statusText);
            setSeedStatus("ok", data.message + ` (Prod: ${data.cfg.products}, Zam: ${data.cfg.orders})`);
          } catch (e) {
            setSeedStatus("err", String(e.message || e));
          }
          btn.disabled = false;
        });

        document.getElementById("btn-indexes").addEventListener("click", async () => {
          const btnIdx = document.getElementById("btn-indexes");
          btnIdx.disabled = true;
          setSeedStatus("work", "Zakładanie indeksów benchmarkowych…");
          try {
            const res = await fetch(API + "/api/indexes", { method: "POST" });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.ok) throw new Error(data.message || res.statusText);
            setSeedStatus("ok", data.message);
          } catch (e) {
            setSeedStatus("err", String(e.message || e));
          }
          btnIdx.disabled = false;
        });
      } catch (e) {
        document.getElementById("seed-status").className = "err";
        document.getElementById("seed-status").textContent = "Błąd komunikacji z API. Sprawdź, czy serwer działa.";
      }
    })();
  </script>
</body>
</html>
